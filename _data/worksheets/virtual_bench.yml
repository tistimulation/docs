# Virtual Bench worksheet content.
#
# Block types:
#   note     - plain instruction text
#   step     - bold "do this" instruction
#   params   - parameter table; group style: i1 | i2 | fsk
#   question - see fields below
#
# Question fields:
#   id          - unique, stable id (used to save answers in the browser)
#   prompt      - the question
#   parts       - graded inputs, each with:
#                   kind: choice  -> options + answer
#                   kind: numeric -> answer + unit + tolerance (absolute)
#                   kind: ratio   -> answer as "a:b" (accepts 1:3, 1/3, 0.5:1.5, 0.333)
#   text        - label for a free-text box (never graded, answer revealed instead)
#   task        - label for a "done" checkbox (no grading)
#   explanation - the model answer, shown once the participant submits
#
# Strings may contain simple HTML (<b>, <i>, <br>, <ul><li>).

id: virtual_bench
title: TI Stimulation Virtual Bench
report_title: TI Stimulation Virtual Bench – Worksheet Report

sections:
  - heading: Waveform Visualiser
    blocks:
      - type: params
        title: Parameter settings
        groups:
          - name: I1
            style: i1
            rows:
              - ["Frequency 1 (Hz)", 2000]
              - ["Phase 1 (Degrees)", 0]
              - ["Amplitude 1 (mA)", 1]
          - name: I2
            style: i2
            rows:
              - ["Frequency 2 (Hz)", 2010]
              - ["Phase 2 (Degrees)", 180]
              - ["Amplitude 2 (mA)", 1]

      - type: note
        text: "Inspect the waveform of the applied currents and voltages."

      - type: question
        id: wf-modulated
        prompt: "Is the amplitude of the current or voltage modulated?"
        parts:
          - label: Current
            kind: choice
            options: ["Yes", "No"]
            answer: "No"
          - label: Voltage
            kind: choice
            options: ["Yes", "No"]
            answer: "Yes"
        text: "If modulation is observed – why?"
        explanation: "Current: No. Voltage: Yes. In TI stimulation two currents are simultaneously applied to the head (a common conductor). To keep each current at a single frequency at the electrode sites, the voltage is automatically adjusted to counteract the other current. The applied currents hence oscillate at a single frequency, with no amplitude modulation (i.e., no change in the amplitude over time). In contrast, the applied voltages can oscillate at two frequencies, resulting in an amplitude modulation."

      - type: note
        text: "Inspect the spectrum of the sum current."

      - type: question
        id: wf-df
        prompt: "Does it have a frequency component at <i>Δf</i>?"
        parts:
          - kind: choice
            options: ["Yes", "No"]
            answer: "No"
        text: "Why or why not?"
        explanation: "No. The sum of current <i>I</i><sub>1</sub> oscillating at 2000 Hz and current <i>I</i><sub>2</sub> oscillating at 2010 Hz is a current that oscillates at both 2000 Hz and 2010 Hz, leading to amplitude modulation at the difference frequency <i>Δf</i> = 10 Hz (2010 Hz − 2000 Hz), but there is no current component oscillating at <i>Δf</i>."

      - type: note
        text: "Inspect the waveform and spectrum of the sum current."

      - type: question
        id: wf-max
        prompt: "What is the maximum amplitude?"
        parts:
          - kind: numeric
            answer: 2
            unit: mA
            tolerance: 0.05
        explanation: "2 mA. The maximum amplitude of the current sum is the sum of the individual current amplitudes. Since each current is 1 mA, the maximal current sum is 2 mA."

      - type: question
        id: wf-env
        prompt: "What is the envelope amplitude, (maximum envelope − minimum envelope) / 2?"
        parts:
          - kind: numeric
            answer: 1
            unit: mA
            tolerance: 0.05
        explanation: "1 mA. The maximum amplitude is 1 mA + 1 mA = 2 mA. The minimum amplitude is 1 mA − 1 mA = 0 mA. The envelope amplitude is half of the difference between the maximum and minimum amplitudes: (max − min) / 2 = (2 mA − 0 mA) / 2 = 1 mA."

      - type: step
        text: "Decrease the amplitude of I1 (Amplitude 1) to 0.5 mA.<br>Increase the amplitude of I2 (Amplitude 2) to 1.5 mA."

      - type: note
        text: "Inspect the waveform and spectrum of the sum current."

      - type: question
        id: wf-max-2
        prompt: "Is the maximum current different?"
        parts:
          - kind: choice
            options: ["Yes", "No"]
            answer: "No"
        explanation: "No. The maximum amplitude is not different since we decreased current <i>I</i><sub>1</sub> by 0.5 mA and increased current <i>I</i><sub>2</sub> by the same amount (0.5 mA), so the maximum is still 0.5 mA + 1.5 mA = 2 mA."

      - type: question
        id: wf-env-2
        prompt: "Is the envelope amplitude different?"
        parts:
          - kind: choice
            options: ["Yes", "No"]
            answer: "Yes"
        text: "Why?"
        explanation: "Yes. Although the maximum amplitude is the same, the minimum amplitude is larger (1.5 mA − 0.5 mA = 1 mA), resulting in a smaller envelope amplitude: (2 mA − 1 mA) / 2 = 0.5 mA."

  - heading: Field Distribution Visualiser
    blocks:
      - type: note
        text: "Switch to the Field Distribution Visualiser tab, and apply the following settings:"

      - type: params
        title: Parameter settings
        groups:
          - name: Pair A Electrodes
            style: i1
            rows:
              - ["A+", "E11"]
              - ["A−", "E8"]
              - ["f1 (Hz)", 2000]
              - ["I1 (mA)", 1]
          - name: Pair B Electrodes
            style: i2
            rows:
              - ["B+", "E1"]
              - ["B−", "E4"]
              - ["f2 (Hz)", 2010]
              - ["I2 (mA)", 1]

      - type: note
        text: "Inspect the locus of the TI stimulation (envelope modulation amplitude) in the x and y directions."

      - type: question
        id: fd-stronger
        prompt: "Which one is stronger?"
        parts:
          - kind: choice
            options: ["X direction", "Y direction"]
            answer: "Y direction"
        explanation: "The Y direction is stronger."

      - type: step
        text: "Change A+ to E10 and B+ to E2."

      - type: question
        id: fd-locus
        prompt: "How does it affect the TI stimulation locus?"
        text: "Your observation"
        explanation: "The locus is split in two in the X direction."

      - type: step
        text: "Change the Pair A current I1 amplitude to 0.5 mA.<br>Change the Pair B current I2 amplitude to 1.5 mA."

      - type: question
        id: fd-ratio-1
        prompt: "What is the current sum and current amplitude ratio?"
        parts:
          - label: Current sum
            kind: numeric
            answer: 2
            unit: mA
            tolerance: 0.01
          - label: "Amplitude ratio (I1 : I2)"
            kind: ratio
            answer: "1:3"
        explanation: "Sum: 0.5 + 1.5 = 2 mA. Amplitude ratio: 0.5 : 1.5 = 1 : 3."

      - type: question
        id: fd-location-1
        prompt: "How does it affect the location of the TI locus relative to the electrodes?"
        text: "Your observation"
        explanation: "The TI locus is steered towards electrode pair A, the pair with the weaker current."

      - type: note
        text: "Switch back to the Waveform Visualiser tab."

  - heading: FSK TI stimulation
    blocks:
      - type: note
        text: "Change to TI stimulation with frequency shift keying (FSK) waveform and set the following parameters:"

      - type: params
        groups:
          - name: I1 Parameters
            style: i1
            rows:
              - ["Frequency 1 (Hz)", 2000]
              - ["Phase 1 (Degrees)", 0]
              - ["Amplitude I1 (mA)", 1]
          - name: I2 Parameters
            style: i2
            rows:
              - ["Freq 2 Outside Pulse (Hz)", 2000]
              - ["Freq 2 Inside Pulse (Hz)", 2100]
              - ["Phase 2 (Degrees)", 180]
              - ["Amplitude I2 (mA)", 1]
          - name: FSK Parameters
            style: fsk
            rows:
              - ["Pulse Repetition Frequency (Hz)", 10]
              - ["Number of Pulses", 1]

      - type: note
        text: "Inspect the waveform of the applied <b>currents</b>.<br><i>The simulation speed can be slowed down with the ‘Time Speed’ slider in the Playback controls. The simulation can also be paused with the pause button in the Playback controls.</i>"

      - type: question
        id: fsk-shift
        prompt: "Is the frequency shift evident in I2?"
        parts:
          - kind: choice
            options: ["Yes", "No"]
            answer: "No"
        explanation: "No. The periodic frequency switch is not easily evident in the waveform due to the phase continuity and the relatively small frequency step (compared to kHz)."

      - type: note
        text: "Inspect the spectrum of the applied currents."

      - type: question
        id: fsk-spectrum
        prompt: "How does it differ from standard TI stimulation?"
        text: "Your observation"
        explanation: "The spectrum of <i>I</i><sub>2</sub> is different from the single frequency component seen in standard TI stimulation. Specifically, the periodic frequency switching in <i>I</i><sub>2</sub> results in spectral components at the stimulation frequencies (2000 Hz, 2100 Hz) and at 10 Hz (the pulse repetition frequency) intervals from them, with a decaying amplitude that is zeroed at 100 Hz (the inverse of the pulse width) intervals."

      - type: note
        text: "Inspect the waveform of the current sum."

      - type: question
        id: fsk-sum
        prompt: "How does it differ from the waveforms of the applied currents?"
        text: "Your observation"
        explanation: "The current sum displays periodic pulses of kHz signal with zero amplitude between pulses."

      - type: note
        text: "Inspect the spectrum of the current sum."

      - type: question
        id: fsk-df
        prompt: "Does it have a frequency component at <i>Δf</i>?"
        parts:
          - kind: choice
            options: ["Yes", "No"]
            answer: "No"
        explanation: "No. Because <i>Δf</i> is 100 Hz, the pulsed waveform decays to zero at every multiple of <i>Δf</i> (decaying sinc sidelobes)."

      - type: question
        id: fsk-prf
        prompt: "How is the pulse repetition frequency evident in the spectrum?"
        text: "Your observation"
        explanation: "The spectral spikes are all 10 Hz apart from each other."

      - type: step
        text: "Change Phase 2 to various values (0, 90, 180, 270)."

      - type: question
        id: fsk-phase
        prompt: "How does the phase delay between the currents affect the sum current?"
        text: "Your observation"
        explanation: "<ul><li><b>0°:</b> full envelope outside of the pulse</li><li><b>90° / 270°:</b> partial envelope outside of the pulse</li><li><b>180°:</b> no envelope outside of the pulse</li></ul>"

      - type: step
        text: "Change Phase 2 to 180 degrees.<br>Change Freq 2 inside pulse to 2020 Hz.<br>Change PRF to 5 Hz."

      - type: question
        id: fsk-duration-1
        prompt: "What is the time from frequency switch onset to offset?"
        parts:
          - kind: numeric
            answer: 50
            unit: ms
            tolerance: 1
        explanation: "50 ms – one pulse lasts one beat period, 1 / <i>Δf</i> = 1 / (2020 − 2000 Hz) = 50 ms."

      - type: step
        text: "Change Number of Pulses to 3."

      - type: question
        id: fsk-duration-3
        prompt: "What is the time from frequency switch onset to offset?"
        parts:
          - kind: numeric
            answer: 150
            unit: ms
            tolerance: 1
        text: "Why?"
        explanation: "150 ms – the frequency switch now lasts 3 beat periods: 3 × 50 ms = 150 ms."

      - type: question
        id: fsk-set
        prompt: "Set the parameters to 100 Hz <i>Δf</i>, every 200 ms, with 50 ms between frequency switch onset and offset."
        task: "Done – I have set these parameters in the simulator"
        explanation: "Freq 2 Inside Pulse = 2100 Hz (<i>Δf</i> = 100 Hz), PRF = 5 Hz (one switch every 200 ms), Number of Pulses = 5 (50 ms ÷ 10 ms beat period)."

  - heading: PWM TI stimulation
    blocks:
      - type: note
        text: "Change to TI stimulation with PWM waveform and set the following parameters:"

      - type: params
        title: Parameter settings
        groups:
          - name: I1
            style: i1
            rows:
              - ["Frequency 1 (Hz)", 2000]
              - ["Phase 1 (Degrees)", 0]
              - ["Amplitude 1 (mA)", 1]
          - name: I2
            style: i2
            rows:
              - ["Frequency 2 (Hz)", 2010]
              - ["Phase 2 (Degrees)", 180]
              - ["Amplitude 2 (mA)", 1]

      - type: note
        text: "Inspect the waveform of the applied currents."

      - type: question
        id: pwm-diff
        prompt: "How do they differ from standard TI stimulation?"
        text: "Your observation"
        explanation: "The applied currents are square waves and not sine waves."

      - type: note
        text: "Inspect the spectrum of the applied currents and the current sum."

      - type: question
        id: pwm-df
        prompt: "Does it have a frequency component at <i>Δf</i>?"
        parts:
          - kind: choice
            options: ["Yes", "No"]
            answer: "Yes"
        explanation: "Yes. Because square waves are highly non-linear."
